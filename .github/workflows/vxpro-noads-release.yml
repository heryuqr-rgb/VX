name: VX Pro No-Ads Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout VX Pro No-Ads
        uses: actions/checkout@v4
        with:
          ref: noads-release

      - name: Checkout dependencies
        shell: bash
        run: |
          cd ..
          git clone https://github.com/5VNetwork/tm-plugin.git tm-plugin
          git clone --branch noads-release https://github.com/heryuqr-rgb/flutter_common.git flutter_common

      - name: Create required files
        shell: bash
        run: |
          mkdir -p ../tm-plugin/tm_windows/assets
          mkdir -p ../tm-plugin/tm_linux/assets
          mkdir -p ../tm-plugin/tm_android/android/libs
          mkdir -p assets/google_fonts
          mkdir -p assets/geo

          touch ../tm-plugin/tm_windows/assets/x.dll
          touch ../tm-plugin/tm_windows/assets/wintun.dll
          touch ../tm-plugin/tm_windows/assets/vx_service.zip
          touch ../tm-plugin/tm_linux/assets/x
          touch ../tm-plugin/tm_linux/assets/wintun

      - name: Verify no-ads source
        shell: bash
        run: |
          echo "Checking VX Pro source..."
          grep -n "AdsProvider" lib/main.dart
          echo "Checking flutter_common ad source..."
          grep -n "class Ads" ../flutter_common/packages/ads/lib/ad.dart

      - name: Download geo
        shell: bash
        run: |
          mkdir -p assets/geo
          curl -fL "https://github.com/5VNetwork/process-geo/releases/latest/download/simplified_geoip.dat" -o assets/geo/simplified_geoip.dat
          curl -fL "https://github.com/5VNetwork/process-geo/releases/latest/download/simplified_geosite.dat" -o assets/geo/simplified_geosite.dat

      - name: Download library from release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          gh release download build \
            -R 5VNetwork/vx-core \
            -p "x.aar"

          cp x.aar ../tm-plugin/tm_android/android/libs/x.aar
          test -s ../tm-plugin/tm_android/android/libs/x.aar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          KEY_PROPERTY: ${{ secrets.KEY_PROPERTY }}
        shell: bash
        run: |
          test -n "$UPLOAD_KEY" || {
            echo "Missing UPLOAD_KEY secret"
            exit 1
          }

          test -n "$KEY_PROPERTY" || {
            echo "Missing KEY_PROPERTY secret"
            exit 1
          }

          mkdir -p android
          echo "$UPLOAD_KEY" | base64 --decode > android/upload-keystore.jks
          echo "$KEY_PROPERTY" | base64 --decode > android/key.properties

          test -s android/upload-keystore.jks
          test -s android/key.properties

      - name: Build ARM64 Release APK
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          CN_DIRECT_APPS_KEY: ${{ secrets.CN_DIRECT_APPS_KEY }}
        shell: bash
        run: |
          flutter build apk \
            --release \
            --flavor apk \
            --target-platform android-arm64 \
            --dart-define=LOG_KEY="$LOG_KEY" \
            --dart-define=CN_DIRECT_APPS_KEY="$CN_DIRECT_APPS_KEY"

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "APK release ARM64 tidak ditemukan!"
            find build/app/outputs -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VX-Pro-noads-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
